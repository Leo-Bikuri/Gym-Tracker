<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BUILD MASS — Hypertrophy Plan</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body { background: #0a0a0a; color: #f0ede8; font-family: 'Georgia', serif; overflow-x: hidden; }

    .header-title { font-family: 'Bebas Neue', sans-serif; font-size: clamp(44px, 9vw, 88px); letter-spacing: 0.04em; line-height: 0.9; }

    .day-pill { font-family: 'Bebas Neue', sans-serif; font-size: 17px; letter-spacing: 0.1em; padding: 10px 16px; border-radius: 4px; border: 1px solid #333; background: transparent; color: #888; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
    .day-pill:hover { border-color: #555; color: #bbb; }
    .day-pill.active { border-color: var(--accent); color: var(--accent); background: rgba(255,255,255,0.04); }

    .ex-card { border: 1px solid #222; border-radius: 10px; padding: 16px 18px; background: #111; transition: all 0.2s; position: relative; overflow: hidden; }
    .ex-card::before { content:''; position: absolute; left:0; top:0; bottom:0; width:3px; background: var(--accent); opacity: 0.35; transition: opacity 0.2s; }
    .ex-card.open::before, .ex-card:hover::before { opacity: 1; }
    .ex-card.open { border-color: rgba(255,255,255,0.1); background: #141414; }

    .badge { font-family: 'DM Sans', sans-serif; font-size: 10px; font-weight: 500; letter-spacing: 0.09em; text-transform: uppercase; padding: 3px 7px; border-radius: 3px; background: #1e1e1e; color: #555; }
    .badge.compound { background: rgba(255,255,255,0.06); color: var(--accent); }

    .log-input { background: #1a1a1a; border: 1px solid #2e2e2e; border-radius: 6px; color: #f0ede8; font-family: 'DM Sans', sans-serif; font-size: 15px; padding: 9px 12px; width: 100%; outline: none; transition: border-color 0.2s; -webkit-appearance: none; appearance: none; }
    .log-input:focus { border-color: var(--accent, #E8FF47); }
    .log-input::placeholder { color: #444; }

    .log-btn { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.1em; font-size: 16px; padding: 10px 20px; border-radius: 6px; border: none; cursor: pointer; transition: all 0.2s; }
    .log-btn.save { background: var(--accent, #E8FF47); color: #0a0a0a; }
    .log-btn.save:active { opacity: 0.8; transform: scale(0.97); }
    .log-btn.ghost { background: transparent; border: 1px solid #2e2e2e; color: #555; font-size: 12px; padding: 7px 14px; letter-spacing: 0.08em; }

    .logged-dot { width: 7px; height: 7px; border-radius: 50%; background: #3ddc84; flex-shrink: 0; box-shadow: 0 0 6px rgba(61,220,132,0.5); }
    .prev-badge { display: inline-flex; align-items: center; gap: 6px; background: rgba(61,220,132,0.08); border: 1px solid rgba(61,220,132,0.2); border-radius: 5px; padding: 6px 11px; font-family: 'DM Sans', sans-serif; font-size: 13px; color: #3ddc84; }
    .hist-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; border-radius: 6px; background: #1a1a1a; border: 1px solid #222; margin-top: 6px; }

    .principle-card { background: #111; border: 1px solid #1e1e1e; border-radius: 8px; padding: 18px; transition: border-color 0.2s; }
    .principle-card:hover { border-color: #333; }

    .stat-box { background: #111; border: 1px solid #222; border-radius: 8px; padding: 12px 14px; text-align: center; cursor: pointer; transition: border-color 0.2s, background 0.2s; position: relative; min-width: 90px; }
    .stat-box:hover { border-color: #444; background: #161616; }
    .stat-box.editing { border-color: #E8FF47; background: #161616; }
    .stat-edit-input { background: transparent; border: none; outline: none; font-family: 'Bebas Neue', sans-serif; font-size: 20px; color: #E8FF47; letter-spacing: 0.05em; width: 100%; text-align: center; -webkit-appearance: none; appearance: none; }

    .scrollbar-hide { scrollbar-width: none; -ms-overflow-style: none; }
    .scrollbar-hide::-webkit-scrollbar { display: none; }

    .tab-bar { display: flex; border-bottom: 1px solid #1a1a1a; }
    .tab-btn { flex: 1; padding: 14px 8px; font-family: 'DM Sans', sans-serif; font-size: 13px; letter-spacing: 0.05em; background: transparent; border: none; color: #555; cursor: pointer; transition: all 0.2s; border-bottom: 2px solid transparent; margin-bottom: -1px; }
    .tab-btn.active { color: #f0ede8; border-bottom-color: #E8FF47; }

    .toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); font-family: 'DM Sans', sans-serif; font-size: 13px; padding: 10px 20px; border-radius: 8px; z-index: 999; pointer-events: none; white-space: nowrap; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    .toast.green { background: #1a2a1a; border: 1px solid rgba(61,220,132,0.3); color: #3ddc84; }
    .toast.yellow { background: #252510; border: 1px solid rgba(232,255,71,0.3); color: #E8FF47; }

    @media (max-width: 600px) {
      .hdr-grid { flex-direction: column !important; }
      .hdr-stats { flex-direction: row !important; gap: 8px !important; }
      .stat-box { flex: 1; }
    }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { useState, useEffect, useRef } = React;

  /* ─── STORAGE ─── */
  const LOG_KEY     = 'bm_log_v1';
  const PROFILE_KEY = 'bm_profile_v1';

  const loadLog     = () => { try { return JSON.parse(localStorage.getItem(LOG_KEY) || '{}'); } catch { return {}; } };
  const saveLog     = (l) => localStorage.setItem(LOG_KEY, JSON.stringify(l));
  const loadProfile = () => { try { return { ...{height:192, weight:75, age:24}, ...JSON.parse(localStorage.getItem(PROFILE_KEY) || '{}') }; } catch { return {height:192, weight:75, age:24}; } };
  const saveProfile = (p) => localStorage.setItem(PROFILE_KEY, JSON.stringify(p));

  const exKey = (n) => n.replace(/[^a-z0-9]/gi,'_').toLowerCase();
  const today = () => new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});

  /* ─── NUTRITION CALCULATOR ─── */
  // Mifflin-St Jeor BMR (male) × 1.375 lightly active. Conservative 250-400 surplus.
  function calcNutrition(profile) {
    const { weight, height, age } = profile;
    const bmr      = Math.round(10 * weight + 6.25 * height - 5 * age + 5);
    const tdee     = Math.round(bmr * 1.375);
    const calLow   = tdee + 250;
    const calHigh  = tdee + 400;
    const protLow  = Math.round(weight * 2.0);
    const protHigh = Math.round(weight * 2.2);
    const fatLow   = Math.round(weight * 0.9);
    const fatHigh  = Math.round(weight * 1.1);
    const protMid  = Math.round((protLow + protHigh) / 2);
    const fatMid   = Math.round((fatLow + fatHigh) / 2);
    const carbLow  = Math.round((calLow  - protMid * 4 - fatMid * 9) / 4);
    const carbHigh = Math.round((calHigh - protMid * 4 - fatMid * 9) / 4);
    return {
      calories: `${calLow.toLocaleString()}–${calHigh.toLocaleString()} kcal`,
      calSub:   `~${tdee.toLocaleString()} kcal maintenance + 250–400 surplus`,
      protein:  `${protLow}–${protHigh} g`,
      protSub:  `${(weight*2.0).toFixed(1)}–${(weight*2.2).toFixed(1)}g per kg bodyweight`,
      carbs:    `${carbLow}–${carbHigh} g`,
      carbSub:  'Primary fuel for training',
      fats:     `${fatLow}–${fatHigh} g`,
      fatSub:   'Hormonal health & recovery',
    };
  }

  /* ─── DATA ─── */
  // RIR (Reps in Reserve) scale — how many reps you could still do at the end of a set
  const rirScale = [
    {rir:0,desc:"Failure — no reps left"},
    {rir:1,desc:"1 rep left in the tank"},
    {rir:2,desc:"2 reps left — target for compounds"},
    {rir:3,desc:"3 reps left — easy / warmup"},
    {rir:4,desc:"4+ reps left — too light"},
  ];

  const deload = {
    title:"Deload Triggers (Autoregulated)",
    sub:"Deload when 2+ of these fire — not on a fixed calendar",
    desc:"Fixed every-4-week deloads are based on guesswork. Your body tells you when it needs one. Watch for the signals below and deload when 2+ trigger — typically every 5–8 weeks depending on the block.",
    rules:[
      {icon:"⏸",label:"Strength stalled ≥2 weeks",detail:"Same weight × same reps for 2+ sessions in a row on a tracked lift = signal."},
      {icon:"😴",label:"Sleep quality dropping",detail:"Trouble falling asleep, waking up tired, restless nights for a week+."},
      {icon:"🦵",label:"Joint pain emerging",detail:"Knees, elbows, shoulders, lower back — any nagging pain that wasn't there 2 weeks ago."},
      {icon:"💓",label:"Resting HR up 5+ bpm",detail:"Persistent elevation over a week. Measure first thing in the morning."},
      {icon:"📉",label:"Motivation crashing",detail:"Dreading sessions you previously enjoyed — often the earliest signal."},
    ],
    protocol:[
      {icon:"⬇️",label:"50% volume, 70% load",detail:"Same exercises, halve the sets, drop weight to ~70%. Should feel noticeably easy."},
      {icon:"✅",label:"Keep all 4 training days",detail:"Don't skip sessions. Reduced intensity is the deload — frequency stays the same."},
      {icon:"⏱",label:"One week, then resume",detail:"Resume your previous block's working weights the following week. Don't push immediately."},
    ],
  };

  const DAYS = [
    { id:"mon",label:"MON",name:"Upper A",sub:"Horizontal Push + Pull",tag:"CHEST · BACK · ARMS",color:"#E8FF47",
      ex:[
        {n:"Flat Dumbbell Press",sets:3,reps:"8–12",rest:"2.5 min",muscle:"Chest",type:"compound",rir:"2",rirNote:"Leave 2 reps in the tank on every set. Don't grind. If the last set feels like 0–1 RIR, you went too heavy — adjust next session.",tip:"DB > barbell for shoulder safety at 192cm. 2–3s controlled lowering. Bring DBs to a full stretch at the bottom — slightly below chest line."},
        {n:"Barbell Bent-Over Row",sets:3,reps:"8–12",rest:"2.5 min",muscle:"Back",type:"compound",rir:"2",rirNote:"2 RIR. The cue: bar speed shouldn't slow noticeably across reps. If it does, you're closer to failure than you think.",tip:"Underhand (supinated) grip emphasises lats over upper back and is kinder to the lower back. Hinge ~45°. Drive elbows back, not flared out."},
        {n:"Incline Dumbbell Press (30°)",sets:3,reps:"10–12",rest:"2 min",muscle:"Upper Chest",type:"compound",rir:"1",rirNote:"1 RIR on working sets. Last set can push to 0–1 RIR.",tip:"Set bench to 30°, not 45° — flatter angle is better for clavicular pec fibres. Slight pause at the bottom."},
        {n:"Cable Row (horizontal attachment)",sets:3,reps:"10–15",rest:"90s",muscle:"Mid Back",type:"isolation",rir:"1",rirNote:"1 RIR. Lower stress than barbell row — can push slightly harder.",tip:"Sit upright, slight lean back at end of pull. Pull bar to lower chest. 2s squeeze on every rep. Don't lurch with the torso."},
        {n:"Dumbbell Lateral Raise",sets:3,reps:"12–20",rest:"60s",muscle:"Side Delts",type:"isolation",rir:"0–1",rirNote:"Push hard. Side delts respond to high effort and low systemic stress. Last set: full failure is fine.",tip:"Slight elbow bend held throughout. Lead with elbows, not hands. Pause briefly at top. Don't shrug — keep traps down."},
        {n:"EZ-Bar Curl",sets:2,reps:"10–12",rest:"90s",muscle:"Biceps",type:"isolation",rir:"1",rirNote:"1 RIR. Two sets is enough — biceps already worked indirectly during rows.",tip:"Use the angled grip on the EZ-bar — kinder on wrists than straight bar. No swinging. Full stretch at the bottom."},
        {n:"Cable Tricep Pushdown",sets:2,reps:"12–15",rest:"60s",muscle:"Triceps",type:"isolation",rir:"0–1",rirNote:"Push to 0–1 RIR. Low fatigue cost. Final set can go to failure.",tip:"Elbows pinned to sides. Full lockout at the bottom. Slow eccentric (2s) on the way up."},
      ]
    },
    { id:"tue",label:"TUE",name:"Lower A",sub:"Quad Dominant",tag:"QUADS · HAMSTRINGS · CALVES",color:"#FF6B35",
      ex:[
        {n:"Front Squat",sets:3,reps:"8–10",rest:"3 min",muscle:"Quads",type:"compound",rir:"2",rirNote:"2 RIR strictly. Never grind. Front squat is a technique lift — form breakdown means you've already exceeded target effort.",tip:"Front-loaded position is kinder to your lumbar spine than back squat for tall lifters. Elbows high. If you can't hold the rack position, sub: Goblet Squat (heavy DB held at chest)."},
        {n:"Romanian Deadlift",sets:3,reps:"8–12",rest:"2.5 min",muscle:"Hamstrings / Glutes",type:"compound",rir:"2",rirNote:"2 RIR. Stop one rep before form breaks. Hamstring DOMS comes back hard after a layoff — start light.",tip:"3s eccentric. Push hips back, soft knee bend, bar stays glued to legs. Feel the hamstring stretch before reversing. Stop the descent when your back wants to round."},
        {n:"Bulgarian Split Squat (DB)",sets:3,reps:"8–12 per leg",rest:"2 min",muscle:"Quads / Glutes",type:"compound",rir:"2",rirNote:"2 RIR. Balance demand makes it feel harder than the load suggests — that's normal.",tip:"Direct attack on your left-side imbalance. Add 1 extra set on the left side. Back foot on bench. Drop straight down. Keep front shin near vertical for more glute, lean forward slightly for more quad."},
        {n:"Cable Leg Extension",sets:3,reps:"12–20",rest:"90s",muscle:"Quads",type:"isolation",rir:"0–1",rirNote:"0–1 RIR. Last set can go to failure. Low systemic stress.",tip:"Full range. Squeeze hard at the top for 1s. Don't slam the weight down — controlled descent."},
        {n:"Dumbbell Walking Lunge",sets:2,reps:"10 per leg",rest:"2 min",muscle:"Glutes / Quads / Hams",type:"compound",rir:"1",rirNote:"1 RIR. Walking lunges fatigue cardio-respiratory system too — pace yourself.",tip:"Long step. Drop back knee close to floor. Drive through front heel. Keep torso upright."},
        {n:"Standing DB Calf Raise",sets:4,reps:"12–15",rest:"60s",muscle:"Calves (Gastrocnemius)",type:"isolation",rir:"0",rirNote:"Train to failure. Calves recover fast and respond to high effort.",tip:"One heavy DB, hold the rack with the other hand for balance. Full stretch at bottom, 2s pause at top. Single-leg variation if balance permits — better unilateral stimulus."},
      ]
    },
    { id:"wed",label:"WED",name:"Rest",sub:"Active Recovery",tag:"RECOVERY",color:"#888",rest:true,
      tips:[
        "Light 20–30 min walk — aim for 8,000 steps today",
        "Foam roll: quads, hamstrings, lats (5 min total)",
        "Static stretching: hips, thoracic spine, lats",
        "Prioritise 7–9 hours sleep",
        "Eat at or slightly above maintenance — don't drop calories on rest days",
        "Apply minoxidil as scheduled (don't skip on rest days)",
      ]
    },
    { id:"thu",label:"THU",name:"Upper B",sub:"Vertical Push + Pull",tag:"SHOULDERS · LATS · ARMS",color:"#47C8FF",
      ex:[
        {n:"Seated Dumbbell Shoulder Press",sets:3,reps:"8–12",rest:"2.5 min",muscle:"Shoulders",type:"compound",rir:"2",rirNote:"2 RIR. DB > barbell here — independent hand movement reduces shoulder impingement risk.",tip:"Set bench upright (90°). DBs start at ear height. Press up and slightly together at the top but don't clank them. Don't fully lock out — keeps tension on the delts."},
        {n:"Pull-Ups (or BB Pendlay Row if no bar)",sets:3,reps:"6–10",rest:"2.5 min",muscle:"Lats / Back",type:"compound",rir:"1–2",rirNote:"1–2 RIR. If bodyweight reps are too few, use a band-assisted setup. If your rack has no pull-up bar, substitute Barbell Pendlay Row: 3×8.",tip:"Wide overhand grip. Pull until chin clears the bar. Full hang at the bottom — full stretch is non-negotiable. Don't kip."},
        {n:"Single-Arm DB Shoulder Press",sets:2,reps:"10–12 per side",rest:"90s",muscle:"Shoulders / Core",type:"isolation",rir:"1",rirNote:"1 RIR. Unilateral work — gives left side concentrated attention.",tip:"Sit on bench upright. Hold the bench with non-working hand for stability. Do the weaker side first. Add 1 extra set on the left if imbalance is still meaningful."},
        {n:"Cable Row (close grip, horizontal attachment)",sets:3,reps:"10–15",rest:"90s",muscle:"Mid Back",type:"isolation",rir:"1",rirNote:"1 RIR. Different angle/grip vs Monday — hits the muscle differently.",tip:"Pull elbows past the torso. Squeeze shoulder blades together at the back. Slow return — don't let the weight stack slam."},
        {n:"Cable Face Pull",sets:3,reps:"15–20",rest:"60s",muscle:"Rear Delts / Rotator Cuff",type:"isolation",rir:"0–1",rirNote:"Light weight, high reps. Quality over load — this is also a shoulder health movement.",tip:"Cable at face height (use the horizontal bar attachment if no rope). Pull to your forehead, not your chin. Externally rotate the hands at the end position so thumbs point behind you."},
        {n:"Dumbbell Hammer Curl",sets:2,reps:"10–12",rest:"90s",muscle:"Biceps / Brachialis",type:"isolation",rir:"1",rirNote:"1 RIR. Brachialis-focused — adds upper-arm thickness.",tip:"Neutral grip (palms facing each other). Keep elbows pinned. Don't swing. Controlled tempo throughout."},
        {n:"Cable Overhead Tricep Extension",sets:3,reps:"12–15",rest:"90s",muscle:"Triceps (Long Head)",type:"isolation",rir:"0–1",rirNote:"Push hard. Long head responds well to stretched-position training.",tip:"Face away from the low pulley. Rope or horizontal bar attachment. Stretch hands behind head, then extend overhead. Keep elbows pointing up and tight to ears."},
      ]
    },
    { id:"fri",label:"FRI",name:"Lower B",sub:"Hip Dominant",tag:"POSTERIOR CHAIN · GLUTES",color:"#B847FF",
      ex:[
        {n:"Barbell Hip Thrust",sets:3,reps:"8–12",rest:"2.5 min",muscle:"Glutes",type:"compound",rir:"2",rirNote:"2 RIR. Form is the main constraint here, not failure.",tip:"Upper back on the bench, feet flat, knees ~90° at top. Use a pad on the bar (or hoodie). Drive through heels. Squeeze glutes hard at the top for 1s. Don't hyperextend the lower back."},
        {n:"Romanian Deadlift (DB or BB)",sets:3,reps:"10–12",rest:"2.5 min",muscle:"Hamstrings",type:"compound",rir:"2",rirNote:"2 RIR. Slight variation from Tuesday — different rep range gives a different fibre stimulus.",tip:"If using DBs, hold one in each hand at thigh level. Same hip-hinge mechanics as Tuesday. The slightly higher reps mean controlled descent matters even more."},
        {n:"DB Reverse Lunge (Stationary)",sets:3,reps:"10 per leg",rest:"2 min",muscle:"Glutes / Quads",type:"compound",rir:"1",rirNote:"1 RIR. Unilateral — finish weaker (left) side first.",tip:"Stationary, not walking. Step back into the lunge, then drive forward to standing. Easier on the knees than forward lunges. Keep torso upright."},
        {n:"DB Step-Up (onto bench)",sets:2,reps:"10 per leg",rest:"90s",muscle:"Glutes / Quads",type:"isolation",rir:"1",rirNote:"1 RIR. Direct unilateral glute/quad work.",tip:"Bench should be knee-height. Whole foot on the bench. Drive through the heel — don't push off the back foot. Step down with control."},
        {n:"Single-Leg DB Romanian Deadlift",sets:2,reps:"8–10 per leg",rest:"90s",muscle:"Hamstrings / Stability",type:"isolation",rir:"1",rirNote:"1 RIR. Stability is the main constraint — don't load aggressively.",tip:"Hold a single DB in the opposite hand to the working leg. Hinge at the hip, free leg extends straight behind. Critical for fixing left-side imbalance."},
        {n:"Seated DB Calf Raise",sets:4,reps:"15–20",rest:"60s",muscle:"Calves (Soleus)",type:"isolation",rir:"0",rirNote:"Train to failure. Soleus emphasis — different muscle to Tuesday's standing variation.",tip:"Sit on bench, DB resting on one knee (or two DBs, one each side). Bent-knee position takes the gastrocnemius out and isolates the soleus. Full stretch and full squeeze."},
      ]
    },
    { id:"sat",label:"SAT",name:"Rest",sub:"Full Rest / Cardio",tag:"RECOVERY",color:"#888",rest:true,
      tips:[
        "Target: 8,000–10,000 steps — your primary cardio tool",
        "Optional: 20 min low-intensity cycling (Zone 2)",
        "Mobility work or swimming if motivated",
        "Prep and cook high-protein meals for the week",
        "Hydrate: aim for 3L water",
        "Weekly check-in: photo (overhead, same lighting), shed count (pillow + drain)",
      ]
    },
    { id:"sun",label:"SUN",name:"Rest",sub:"Full Rest",tag:"RECOVERY",color:"#888",rest:true,
      tips:[
        "Complete rest — muscle grows during recovery, not in the gym",
        "Review last week's log: what progressed, what stalled?",
        "Plan next week's target weights (double progression)",
        "8+ hours sleep tonight",
        "Light walk if desired, no structured cardio",
      ]
    },
  ];

  /* ─── EDITABLE STAT BOX ─── */
  function StatBox({ label, value, unit, field, onSave }) {
    const [editing, setEditing] = useState(false);
    const [draft, setDraft]     = useState(String(value));
    const inputRef              = useRef(null);

    useEffect(() => {
      if (editing && inputRef.current) inputRef.current.focus();
    }, [editing]);

    function commit() {
      const num = parseFloat(draft);
      if (!isNaN(num) && num > 0) onSave(field, num);
      setEditing(false);
    }

    function handleKey(e) {
      if (e.key === 'Enter') commit();
      if (e.key === 'Escape') { setDraft(String(value)); setEditing(false); }
    }

    return (
      <div
        className={"stat-box" + (editing ? ' editing' : '')}
        onClick={() => { if (!editing) { setDraft(String(value)); setEditing(true); } }}
      >
        <div style={{fontFamily:'DM Sans,sans-serif',fontSize:9,letterSpacing:'0.15em',color:editing?'#666':'#444',marginBottom:4,textTransform:'uppercase'}}>{label}</div>
        {editing ? (
          <div style={{display:'flex',alignItems:'baseline',justifyContent:'center',gap:3}}>
            <input
              ref={inputRef}
              className="stat-edit-input"
              type="number"
              inputMode="decimal"
              value={draft}
              onChange={e => setDraft(e.target.value)}
              onBlur={commit}
              onKeyDown={handleKey}
              style={{width: field==='weight'?'52px':field==='age'?'40px':'52px'}}
            />
            <span style={{fontFamily:'DM Sans,sans-serif',fontSize:11,color:'#666'}}>{unit}</span>
          </div>
        ) : (
          <div style={{fontFamily:'Bebas Neue,sans-serif',fontSize:20,color:'#f0ede8',letterSpacing:'0.05em'}}>{value} <span style={{fontSize:13,color:'#555'}}>{unit}</span></div>
        )}
      </div>
    );
  }

  /* ─── WEIGHT LOGGER ─── */
  function WeightLogger({ ex, accent, onSaved }) {
    const k = exKey(ex.n);
    const [entries, setEntries] = useState(() => (loadLog()[k] || []));
    const last = entries[entries.length - 1];
    const loggedToday = last && last.date === today();
    const [wt, setWt]     = useState(loggedToday ? last.weight : '');
    const [note, setNote] = useState(loggedToday ? (last.note || '') : '');
    const [hist, setHist] = useState(false);

    function save() {
      if (!wt.trim()) return;
      const log = loadLog();
      const prev = log[k] || [];
      const entry = { date: today(), weight: wt.trim(), note: note.trim() };
      const updated = loggedToday ? [...prev.slice(0,-1), entry] : [...prev, entry];
      log[k] = updated.slice(-20);
      saveLog(log);
      setEntries(log[k]);
      onSaved(ex.n);
    }

    const prevSessions = entries.filter(e => e.date !== today()).slice(-6).reverse();

    return (
      <div onClick={e => e.stopPropagation()} style={{marginTop:14,paddingTop:14,borderTop:'1px solid #222'}}>
        {last && (
          <div style={{marginBottom:12}}>
            <div className="prev-badge" style={loggedToday?{background:'rgba(61,220,132,0.12)',borderColor:'rgba(61,220,132,0.35)'}:{}}>
              <span>{loggedToday?'✅':'⏱'}</span>
              <span>{loggedToday?'Logged today:':'Last session:'} <strong>{last.weight} kg</strong> — {last.date}</span>
              {last.note && <span style={{fontSize:11,opacity:0.8}}>· {last.note}</span>}
            </div>
          </div>
        )}
        <div style={{display:'flex',gap:8,marginBottom:8}}>
          <div style={{flex:1}}>
            <div style={{fontFamily:'DM Sans,sans-serif',fontSize:10,letterSpacing:'0.1em',color:'#555',textTransform:'uppercase',marginBottom:5}}>Weight (kg)</div>
            <input className="log-input" style={{'--accent':accent}} type="number" inputMode="decimal"
              placeholder={last?last.weight:"e.g. 60"} value={wt} onChange={e=>setWt(e.target.value)} />
          </div>
          <div style={{flex:1.5}}>
            <div style={{fontFamily:'DM Sans,sans-serif',fontSize:10,letterSpacing:'0.1em',color:'#555',textTransform:'uppercase',marginBottom:5}}>Note (optional)</div>
            <input className="log-input" style={{'--accent':accent}} type="text"
              placeholder="e.g. felt strong" value={note} onChange={e=>setNote(e.target.value)} />
          </div>
        </div>
        <div style={{display:'flex',gap:8,alignItems:'center'}}>
          <button className="log-btn save" style={{'--accent':accent}} onClick={save}>
            {loggedToday?'UPDATE':'LOG WEIGHT'}
          </button>
          {prevSessions.length > 0 && (
            <button className="log-btn ghost" onClick={()=>setHist(v=>!v)}>
              {hist?'HIDE':`HISTORY (${prevSessions.length})`}
            </button>
          )}
        </div>
        {hist && prevSessions.length > 0 && (
          <div style={{marginTop:12}}>
            <div style={{fontFamily:'DM Sans,sans-serif',fontSize:10,letterSpacing:'0.12em',color:'#444',textTransform:'uppercase',marginBottom:8}}>Previous Sessions</div>
            {prevSessions.map((e,i)=>(
              <div key={i} className="hist-row">
                <div style={{fontFamily:'DM Sans,sans-serif',fontSize:12,color:'#555'}}>{e.date}</div>
                <div style={{display:'flex',alignItems:'center',gap:10}}>
                  {e.note && <div style={{fontFamily:'DM Sans,sans-serif',fontSize:11,color:'#444',fontStyle:'italic'}}>{e.note}</div>}
                  <div style={{fontFamily:'Bebas Neue,sans-serif',fontSize:18,color:'#f0ede8',letterSpacing:'0.04em'}}>{e.weight} kg</div>
                </div>
              </div>
            ))}
          </div>
        )}
      </div>
    );
  }

  /* ─── HISTORY TAB ─── */
  function HistoryView() {
    const [log, setLog] = useState(loadLog);
    const allEx = DAYS.flatMap(d => d.ex || []);
    const logged = allEx.filter(ex => { const k=exKey(ex.n); return log[k]&&log[k].length>0; });

    function clearAll() {
      if (window.confirm('Clear ALL workout logs? This cannot be undone.')) {
        localStorage.removeItem(LOG_KEY);
        setLog({});
      }
    }

    if (logged.length === 0) return (
      <div style={{padding:'60px 20px',textAlign:'center'}}>
        <div style={{fontSize:44,marginBottom:16}}>📋</div>
        <div style={{fontFamily:'Bebas Neue,sans-serif',fontSize:28,letterSpacing:'0.08em',color:'#2a2a2a',marginBottom:8}}>No Logs Yet</div>
        <div style={{fontFamily:'DM Sans,sans-serif',fontSize:14,color:'#444',lineHeight:1.7,maxWidth:280,margin:'0 auto'}}>
          Head to a training day, tap an exercise, and log your first weight. It'll appear here.
        </div>
      </div>
    );

    return (
      <div style={{padding:'24px 20px 60px',maxWidth:860,margin:'0 auto'}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:24}}>
          <div>
            <div style={{fontFamily:'Bebas Neue,sans-serif',fontSize:30,letterSpacing:'0.05em'}}>WEIGHT LOG</div>
            <div style={{fontFamily:'DM Sans,sans-serif',fontSize:12,color:'#555',marginTop:2}}>{logged.length} exercises tracked</div>
          </div>
          <button className="log-btn ghost" style={{fontSize:11}} onClick={clearAll}>CLEAR ALL</button>
        </div>
        {logged.map((ex,ei)=>{
          const k=exKey(ex.n);
          const entries=[...(log[k]||[])].reverse();
          const latest=entries[0], prev=entries[1];
          const diff=latest&&prev?(parseFloat(latest.weight)-parseFloat(prev.weight)).toFixed(1):null;
          const diffCol=diff>0?'#3ddc84':diff<0?'#ff6b6b':'#888';
          return (
            <div key={ei} style={{marginBottom:14,background:'#111',border:'1px solid #1e1e1e',borderRadius:10,overflow:'hidden'}}>
              <div style={{padding:'14px 18px',background:'#141414',borderBottom:'1px solid #1e1e1e',display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:8}}>
                <div>
                  <div style={{fontFamily:'DM Sans,sans-serif',fontSize:14,fontWeight:500,color:'#f0ede8'}}>{ex.n}</div>
                  <div style={{fontFamily:'DM Sans,sans-serif',fontSize:11,color:'#555',marginTop:2}}>{ex.muscle} · {ex.sets}×{ex.reps}</div>
                </div>
                <div style={{textAlign:'right'}}>
                  <div style={{fontFamily:'Bebas Neue,sans-serif',fontSize:26,color:'#f0ede8',letterSpacing:'0.04em'}}>{latest.weight} kg</div>
                  {diff!==null&&<div style={{fontFamily:'DM Sans,sans-serif',fontSize:12,color:diffCol}}>{diff>0?`+${diff}`:diff} kg vs last</div>}
                </div>
              </div>
              <div style={{padding:'12px 18px'}}>
                {entries.slice(0,8).map((e,i)=>(
                  <div key={i} className="hist-row" style={{marginTop:i>0?6:0}}>
                    <div style={{fontFamily:'DM Sans,sans-serif',fontSize:12,color:'#555'}}>{e.date}</div>
                    <div style={{display:'flex',alignItems:'center',gap:10}}>
                      {e.note&&<div style={{fontFamily:'DM Sans,sans-serif',fontSize:11,color:'#444',fontStyle:'italic'}}>{e.note}</div>}
                      <div style={{fontFamily:'Bebas Neue,sans-serif',fontSize:18,color:i===0?'#E8FF47':'#f0ede8',letterSpacing:'0.04em'}}>{e.weight} kg</div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          );
        })}
      </div>
    );
  }

  /* ─── APP ─── */

      showToast(`${labels[field]} updated — nutrition recalculated`, 'yellow');

    function getLastWeight(name) {
      const log=loadLog(); const k=exKey(name);
      const e=log[k]||[]; return e[e.length-1]||null;
    }

    const PILLARS = [
      {icon:"📈",title:"Progressive Overload",desc:"Hit the top of the rep range on every set → add 2.5kg (compounds) or 1.25kg (isolation) next session. This is the #1 driver of hypertrophy."},
      {icon:"🎯",title:"Volume & Rep Range",desc:"12–18 weekly sets per muscle group. Rep ranges 5–30 all build muscle if effort matches — this plan uses 8–15 to balance stimulus with joint stress."},
      {icon:"🔁",title:"RIR Discipline",desc:"Leave 1–2 reps in the tank on compounds, 0–1 on isolation. Failure isn't required for growth (Grgic & Schoenfeld, 2021 meta-analysis) and adds disproportionate fatigue."},
      {icon:"😴",title:"Sleep = Recovery",desc:"7–9 hours, non-negotiable. <6h chronically elevates cortisol, blunts recovery, and is linked to telogen effluvium (shedding)."},
      {icon:"🥩",title:"Protein Target",desc:`${nut.protein}/day (${(profile.weight*2.0).toFixed(1)}–${(profile.weight*2.2).toFixed(1)}g/kg). Sources: chicken, eggs, Greek yoghurt, fish, lean beef. Spread across 3–5 meals.`},
      {icon:"🔥",title:"Conservative Surplus",desc:`${nut.calories}/day. A small surplus (250–400 kcal) is enough — more just adds fat. Crash deficits trigger telogen effluvium and stall recovery.`},
      {icon:"👟",title:"NEAT & Steps",desc:"Build to 8,000–10,000 steps/day. Improves insulin sensitivity, aids recovery, doesn't tax CNS like cardio."},
      {icon:"📸",title:"Track Shedding Weekly",desc:"Photo (overhead, same lighting) + rough hair count (pillow + drain) every Saturday. Minoxidil dread shed peaks weeks 4–6 — don't react to noise."},
    ];

    return (
      <div style={{minHeight:'100vh',background:'#0a0a0a',color:'#f0ede8'}}>

        {toast && <div className={`toast ${toast.type}`}>{toast.msg}</div>}

        {/* HEADER */}
        <div style={{padding:'36px 20px 24px',borderBottom:'1px solid #1a1a1a'}}>
          <div style={{maxWidth:860,margin:'0 auto'}}>
            <div className="hdr-grid" style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',flexWrap:'wrap',gap:16}}>
              <div>
                <div style={{fontFamily:'DM Sans,sans-serif',fontSize:10,letterSpacing:'0.2em',color:'#444',marginBottom:10,textTransform:'uppercase'}}>Equipment-Matched · Conservative Hypertrophy</div>
                <div className="header-title">BUILD<br /><span style={{color:'#E8FF47'}}>MASS</span></div>
                <div style={{fontFamily:'DM Sans,sans-serif',fontSize:12,color:'#444',marginTop:12,lineHeight:1.6}}>4-Day Upper / Lower · 2× per muscle · RIR-based</div>
              </div>
              <div>
                <div style={{fontFamily:'DM Sans,sans-serif',fontSize:9,letterSpacing:'0.15em',color:'#333',marginBottom:8,textTransform:'uppercase',textAlign:'right'}}>Tap any value to edit</div>
                <div className="hdr-stats" style={{display:'flex',flexDirection:'column',gap:6}}>
                  <StatBox label="Height" value={profile.height} unit="cm"  field="height" onSave={handleProfileSave} />
                  <StatBox label="Weight" value={profile.weight} unit="kg"  field="weight" onSave={handleProfileSave} />

              </div>

        {/* TABS */}
        <div className="tab-bar">
          <button className={"tab-btn"+(tab==='plan'?' active':'')} onClick={()=>setTab('plan')}>📋 WORKOUT PLAN</button>
          <button className={"tab-btn"+(tab==='history'?' active':'')} onClick={()=>{setTab('history');setLogVer(v=>v+1);}}>📊 WEIGHT LOG</button>
        </div>

        {tab==='history' && <HistoryView key={logVer} />}

        {tab==='plan' && <>

          <div style={{padding:'14px 20px 0',maxWidth:860,margin:'0 auto'}}>
            <div style={{background:'rgba(71,200,255,0.05)',border:'1px solid rgba(71,200,255,0.15)',borderRadius:8,padding:'12px 16px',display:'flex',gap:12,alignItems:'flex-start'}}>
              <div style={{fontSize:18,flexShrink:0,marginTop:1}}>🧪</div>

                <div style={{fontFamily:'DM Sans,sans-serif',fontSize:13,fontWeight:500,color:'#47C8FF',marginBottom:3}}>Minoxidil Shed Window: Weeks 2–8</div>

                  ~30–40% of users experience synchronized shedding 2–8 weeks after starting minoxidil. It looks like the drug is failing — it isn't. Old follicles cycle out to make room for new growth. Track weekly, don't react to noise. If shedding persists past week 16, escalate with your dermatologist.

              </div>
            </div>

                <div style={{padding:'18px 22px'}}>
                  <div style={{display:'flex',gap:14,flexWrap:'wrap',marginBottom:16}}>

                      {label:'Carbs',    val:nut.carbs,    sub:nut.carbSub},
                      {label:'Fats',     val:nut.fats,     sub:nut.fatSub},
                    ].map(({label,val,sub})=>(
                      <div key={label} style={{flex:'1 1 120px'}}>
                        <div style={{fontFamily:'DM Sans,sans-serif',fontSize:10,letterSpacing:'0.1em',color:'#444',textTransform:'uppercase',marginBottom:3}}>{label}</div>
                        <div style={{fontFamily:'Bebas Neue,sans-serif',fontSize:22,color:'#f0ede8',letterSpacing:'0.04em'}}>{val}</div>
                        <div style={{fontFamily:'DM Sans,sans-serif',fontSize:11,color:'#444',marginTop:2,lineHeight:1.4}}>{sub}</div>
                      </div>
                    ))}
                  </div>
                  <div style={{padding:'10px 14px',background:'#141414',borderRadius:6,border:'1px solid #1e1e1e',fontFamily:'DM Sans,sans-serif',fontSize:12,color:'#555',lineHeight:1.65}}>
                    <span style={{color:'#666',fontWeight:500}}>💡 Note: </span>
                    Targets update automatically when you edit weight, height, or age in the header. Update your weight every 4–6 weeks. Avoid crash deficits — they trigger telogen effluvium (shedding).
                  </div>
                </div>
              </div>

              {/* DELOAD */}
              <div style={{marginTop:20,background:'#0f0f0f',border:'1px solid #2a2a2a',borderRadius:10,overflow:'hidden'}}>
                <div style={{background:'#141414',padding:'14px 20px',borderBottom:'1px solid #1e1e1e',display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:10}}>
                  <div>
                    <div style={{fontFamily:'Bebas Neue,sans-serif',fontSize:18,letterSpacing:'0.08em',color:'#ff4444'}}>{deload.title}</div>
                    <div style={{fontFamily:'DM Sans,sans-serif',fontSize:11,color:'#555',marginTop:1}}>{deload.sub}</div>
                  </div>
                </div>
                <div style={{padding:'14px 20px'}}>
                  <div style={{fontFamily:'DM Sans,sans-serif',fontSize:12,color:'#555',lineHeight:1.7,marginBottom:14}}>{deload.desc}</div>

                  <div style={{fontFamily:'DM Sans,sans-serif',fontSize:10,letterSpacing:'0.12em',color:'#666',textTransform:'uppercase',marginBottom:8}}>Trigger Signals (2+ = deload)</div>
                  {deload.rules.map((r,i)=>(
                    <div key={i} style={{display:'flex',gap:10,alignItems:'flex-start',padding:'9px 11px',background:'#141414',borderRadius:6,border:'1px solid #1e1e1e',marginBottom:6}}>
                      <span style={{fontSize:14,flexShrink:0}}>{r.icon}</span>
                      <div>
                        <div style={{fontFamily:'DM Sans,sans-serif',fontSize:12,fontWeight:500,color:'#ddd',marginBottom:2}}>{r.label}</div>
                        <div style={{fontFamily:'DM Sans,sans-serif',fontSize:11,color:'#444',lineHeight:1.6}}>{r.detail}</div>
                      </div>
                    </div>
                  ))}

                  <div style={{fontFamily:'DM Sans,sans-serif',fontSize:10,letterSpacing:'0.12em',color:'#666',textTransform:'uppercase',marginTop:14,marginBottom:8}}>Deload Protocol</div>
                  {deload.protocol.map((r,i)=>(
                    <div key={i} style={{display:'flex',gap:10,alignItems:'flex-start',padding:'9px 11px',background:'#141414',borderRadius:6,border:'1px solid #1e1e1e',marginBottom:6}}>
                      <span style={{fontSize:14,flexShrink:0}}>{r.icon}</span>
                      <div>
                        <div style={{fontFamily:'DM Sans,sans-serif',fontSize:12,fontWeight:500,color:'#ddd',marginBottom:2}}>{r.label}</div>
                        <div style={{fontFamily:'DM Sans,sans-serif',fontSize:11,color:'#444',lineHeight:1.6}}>{r.detail}</div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>

              {/* HAIR STACK STATUS */}
              <div style={{marginTop:20,background:'#0f0f0f',border:'1px solid #2a2a2a',borderRadius:10,overflow:'hidden'}}>
                <div style={{background:'#141414',padding:'14px 20px',borderBottom:'1px solid #1e1e1e'}}>
                  <div style={{fontFamily:'Bebas Neue,sans-serif',fontSize:18,letterSpacing:'0.08em',color:'#47C8FF'}}>HAIR TREATMENT STACK</div>
                  <div style={{fontFamily:'DM Sans,sans-serif',fontSize:11,color:'#444',marginTop:3}}>The actual levers that move AGA outcomes — not the workout</div>
                </div>
                <div style={{padding:'14px 20px',display:'flex',flexDirection:'column',gap:8}}>
                  {[
                    {status:"✓",statusCol:"#3ddc84",label:"Minoxidil 5% (Lionhair)",detail:"Daily. Just started — expect dread shed weeks 2–8. This is the drug working, not failing."},
                    {status:"○",statusCol:"#ff6b35",label:"Ketoconazole Shampoo",detail:"3× per week when acquired. Anti-androgen effect at the scalp. Independent evidence base — get this soon."},
                    {status:"✓",statusCol:"#3ddc84",label:"PRP Maintenance",detail:"Scheduled for June 2026. Already in the calendar."},
                    {status:"?",statusCol:"#47C8FF",label:"Finasteride (with dermatologist)",detail:"The lever you're not pulling yet. 1mg/day cuts scalp DHT ~60%. Highest-evidence intervention for AGA progression. Worth a serious conversation."},
                  ].map((s,i)=>(
                    <div key={i} style={{padding:'11px 13px',background:'#141414',borderRadius:8,border:'1px solid #1e1e1e',display:'flex',gap:11,alignItems:'flex-start'}}>
                      <div style={{fontFamily:'Bebas Neue,sans-serif',fontSize:18,color:s.statusCol,lineHeight:1,minWidth:18,flexShrink:0}}>{s.status}</div>
                      <div>
                        <div style={{fontFamily:'DM Sans,sans-serif',fontSize:13,fontWeight:500,color:'#f0ede8',marginBottom:3}}>{s.label}</div>
                        <div style={{fontFamily:'DM Sans,sans-serif',fontSize:11,color:'#555',lineHeight:1.65}}>{s.detail}</div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>

              {/* ECCENTRIC */}
              <div style={{marginTop:12,padding:'13px 16px',background:'#0f0f0f',border:'1px solid #2a2a2a',borderRadius:8,display:'flex',gap:12,alignItems:'flex-start'}}>
                <div style={{fontFamily:'Bebas Neue,sans-serif',fontSize:26,color:'#E8FF47',lineHeight:1,flexShrink:0}}>2–3s</div>
                <div>
                  <div style={{fontFamily:'DM Sans,sans-serif',fontSize:12,fontWeight:500,color:'#ddd',marginBottom:3}}>Eccentric Tempo — every compound lift</div>
                  <div style={{fontFamily:'DM Sans,sans-serif',fontSize:11,color:'#444',lineHeight:1.65}}>Lower the weight in 2–3 full seconds. If a rep takes less than 2s on the way down, you're moving too fast. Slow eccentrics = more mechanical tension, better control, lower injury risk.</div>
                </div>
              </div>

              <div style={{marginTop:16,fontFamily:'DM Sans,sans-serif',fontSize:10,color:'#2a2a2a',lineHeight:1.8}}>
                Based on Schoenfeld et al. (2017, 2021, 2022) · Pelland/Robinson/Norton meta-analysis (2024) · Grgic & Schoenfeld failure meta-analysis (2021) · Lak et al. creatine + DHT RCT (2025, JISSN).
              </div>
            </div>
          </div>
        </>}
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
